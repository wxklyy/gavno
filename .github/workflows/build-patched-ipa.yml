name: Build S2Rise Debian Package

on:
  push:
    branches: [main]
    paths:
      - 'cheat/**'
      - '.github/workflows/build-patched-ipa.yml'
  workflow_dispatch:

jobs:
  build-cheat-and-patch:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Theos
        run: |
          brew install dpkg make ldid-procursus
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C $THEOS/sdks --strip-components=1

      - name: Build S2Rise.dylib
        run: |
          cd cheat
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH

          # build the tweak as a dylib
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

          # locate compiled dylib
          DYLIB=$(find .theos -type f -name "S2Rise.dylib" ! -path "*.dSYM*" | head -1)
          if [ -z "$DYLIB" ]; then
            echo "[-] S2Rise.dylib not found in build output"
            find .theos -type f
            exit 1
          fi

          echo "[+] built: $DYLIB"
          file "$DYLIB"
          cp "$DYLIB" $GITHUB_WORKSPACE/S2Rise.dylib

          # Preserve the rootless Debian package produced by Theos for Sileo.
          DEB=$(find packages .theos -type f -name "*.deb" ! -path "*.dSYM*" 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then
            echo "[-] rootless .deb package not found"
            find .theos -type f | sort
            exit 1
          fi
          echo "[+] built package: $DEB"
          cp "$DEB" $GITHUB_WORKSPACE/S2Rise-rootless.deb

      - name: Upload Raw Dylib
        uses: actions/upload-artifact@v4
        with:
          name: S2Rise-dylib
          path: S2Rise.dylib
          retention-days: 30

      - name: Upload Rootless Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: S2Rise-rootless-deb
          path: S2Rise-rootless.deb
          retention-days: 30
